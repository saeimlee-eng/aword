
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src *; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>A word</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #29C5D6;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 32px 24px 40px;
    }

    .title {
      font-size: clamp(64px, 18vw, 96px);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #000;
      line-height: 1;
      text-align: left;
    }

    .subtitle {
      font-size: 15px;
      color: #000;
      line-height: 1.6;
      margin-top: 20px;
      text-align: left;
    }

    .spacer { flex: 1; }

    .bottom {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .input-wrap {
      display: block;
      width: 100%;
    }

    input[type="text"] {
      display: block;
      width: 100%;
      font-size: 15px;
      font-family: inherit;
      line-height: 1.6;
      border: none;
      border-bottom: 1px solid rgba(0,0,0,0.15);
      background: transparent;
      outline: none;
      color: #000;
      padding: 0 0 5px;
      -webkit-appearance: none;
    }

    input[type="text"]::placeholder { color: rgba(0,0,0,0.35); }

    .bottom-row { margin-top: 20px; }

    .send-btn {
      font-size: 15px;
      font-family: inherit;
      font-weight: 400;
      letter-spacing: 0.01em;
      background: #fff;
      border: 1.5px solid #000;
      color: #000;
      cursor: pointer;
      padding: 12px 0;
      width: 100%;
      border-radius: 4px;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .send-btn:active { opacity: 0.6; }
    .send-btn:disabled { opacity: 0.3; }

    /* 팝업 */
    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .popup-overlay.show {
      display: flex;
    }

    .popup {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      width: calc(100% - 64px);
      max-width: 280px;
    }

    .popup-title {
      font-size: 20px;
      font-weight: 700;
      color: #000;
      margin-bottom: 6px;
    }

    .popup-sub {
      font-size: 14px;
      color: rgba(0,0,0,0.45);
      margin-bottom: 24px;
    }

    .popup-btn {
      font-size: 14px;
      font-family: inherit;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 0;
      width: 100%;
      cursor: pointer;
    }

    .popup-btn:active { opacity: 0.7; }
  </style>
</head>
<body>

  <div id="app-view" style="display:flex;flex-direction:column;flex:1">
    <div class="title">A word.</div>
    <div class="subtitle">Leave any message for me and press send.</div>
    <div class="spacer"></div>
    <div class="bottom">
      <div class="input-wrap">
        <input type="text" id="msg" placeholder="a word for me..." maxlength="300" />
      </div>
      <div class="bottom-row">
        <button class="send-btn" id="send-btn">send</button>
        <div id="note-area" style="font-size:13px;color:rgba(0,0,0,0.6);margin-top:8px"></div>
      </div>
      <p style="text-align:right;font-size:12px;color:rgba(0,0,0,0.25);margin-top:10px">Created by saeim.lee</p>
    </div>
  </div>

  <!-- 팝업 -->
  <div class="popup-overlay" id="popup">
    <div class="popup">
      <div class="popup-title">sent.</div>
      <div class="popup-sub">thank you :)</div>
      <button class="popup-btn" onclick="closePopup()">ok</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://myjwnxqtlketmpfyndqd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15andueHF0bGtldG1wZnluZHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNzQ5MjIsImV4cCI6MjA5NDg1MDkyMn0.DpeE0T8vhi3g5hmBcndxXpcrEPg_a-ldeUTbFLNSZCU';

    const btn = document.getElementById('send-btn');
    const msgEl = document.getElementById('msg');
    const noteEl = document.getElementById('note-area');

    btn.addEventListener('click', send);
    msgEl.addEventListener('keydown', e => {
      if (e.key === 'Enter') e.preventDefault();
    });

    async function send() {
      const msg = msgEl.value.trim();
      if (!msg) return;
      btn.disabled = true;
      noteEl.textContent = '';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/message`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ message: msg }),
        });
        if (!res.ok) throw new Error();
        msgEl.value = '';
        document.getElementById('popup').classList.add('show');
      } catch {
        noteEl.style.color = 'rgba(0,0,0,0.6)';
        noteEl.textContent = 'something went wrong.';
        btn.disabled = false;
      }
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('show');
      btn.disabled = false;
    }
  </script>
</body>
</html>
